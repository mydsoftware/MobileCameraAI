<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MobileCameraAI — دو دوربین</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0b0b0b;
      color: #f2f2f2;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 12px 14px;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      background: #151515;
      border-bottom: 1px solid #222;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      justify-content: center;
      flex-wrap: wrap;
      background: #121212;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      background: #2a2a2a;
      color: #fff;
      cursor: pointer;
    }
    button.active { background: #2f6fed; }
    button:active { transform: scale(0.98); }
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 8px;
      min-height: 0;
    }
    @media (min-width: 700px) {
      .grid.both { grid-template-columns: 1fr 1fr; }
    }
    .cam {
      position: relative;
      background: #000;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
      min-height: 42vh;
    }
    .cam.hidden { display: none; }
    .label {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      background: rgba(0,0,0,.65);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
    }
    iframe {
      width: 100%;
      height: 100%;
      min-height: 42vh;
      border: 0;
      background: #000;
      display: block;
    }
    .hint {
      text-align: center;
      font-size: 12px;
      color: #888;
      padding: 8px 12px 14px;
    }
    .links a { color: #8ab4ff; }
  </style>
</head>
<body>
  <header>MobileCameraAI — مشاهده دو دوربین</header>

  <div class="toolbar">
    <button id="btnBoth" class="active" onclick="show('both')">هر دو</button>
    <button id="btn1" onclick="show('1')">دوربین ۱</button>
    <button id="btn2" onclick="show('2')">دوربین ۲</button>
    <button onclick="reloadAll()">تازه‌سازی</button>
  </div>

  <div id="grid" class="grid both">
    <div class="cam" id="box1">
      <div class="label">دوربین ۱</div>
      <iframe id="cam1" src="http://37.202.152.217:8001" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="cam" id="box2">
      <div class="label">دوربین ۲</div>
      <iframe id="cam2" src="http://37.202.152.217:8002" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
  </div>

  <p class="hint">
    اگر iframe خالی بود، دوربین‌ها را جداگانه باز کن و لاگین کن، بعد تازه‌سازی بزن.<br>
    <span class="links">
      <a href="http://37.202.152.217:8001" target="_blank">دوربین ۱</a> ·
      <a href="http://37.202.152.217:8002" target="_blank">دوربین ۲</a>
    </span>
  </p>

  <script>
    const urls = {
      1: 'http://37.202.152.217:8001',
      2: 'http://37.202.152.217:8002'
    };

    function show(mode) {
      const grid = document.getElementById('grid');
      const box1 = document.getElementById('box1');
      const box2 = document.getElementById('box2');
      document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));

      if (mode === 'both') {
        document.getElementById('btnBoth').classList.add('active');
        grid.classList.add('both');
        box1.classList.remove('hidden');
        box2.classList.remove('hidden');
      } else if (mode === '1') {
        document.getElementById('btn1').classList.add('active');
        grid.classList.remove('both');
        box1.classList.remove('hidden');
        box2.classList.add('hidden');
      } else {
        document.getElementById('btn2').classList.add('active');
        grid.classList.remove('both');
        box1.classList.add('hidden');
        box2.classList.remove('hidden');
      }
    }

    function reloadAll() {
      document.getElementById('cam1').src = urls[1];
      document.getElementById('cam2').src = urls[2];
    }
  </script>
</body>
</html>
