<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uniview Auth + Live Test</title><style>body{font-family:Arial;background:#111;color:#fff;max-width:700px;margin:auto;padding:20px}input,button,select{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:7px;border:1px solid #555}pre{white-space:pre-wrap;background:#222;padding:12px;border-radius:8px;min-height:160px}</style><h2>تست احراز هویت Uniview</h2><input id="user" value="admin" placeholder="Username"><input id="pass" type="password" placeholder="Password"><select id="cam"><option value="8001">دوربین ۱ — 8001</option><option value="8002">دوربین ۲ — 8002</option></select><select id="stream"><option value="0">Stream 1 / video1</option><option value="1">Stream 2 / video2</option></select><button onclick="test()">تست LAPI + دریافت LiveStreamURL</button><pre id="out">رمز عبور فقط در مرورگر استفاده می‌شود و در GitHub ذخیره نمی‌شود.</pre><script>const o=document.getElementById('out');function show(x){o.textContent+=x+'\n'}async function test(){o.textContent='';const port=cam.value,st=stream.value,u=user.value,p=pass.value;const url=`http://37.202.152.217:${port}/LAPI/V1.0/Channels/0/Media/Video/Streams/${st}/LiveStreamURL?TransProtocol=2&randomKey=${Date.now()}`;show('Request: '+url);show('در حال درخواست با احراز هویت...');try{const h='Basic '+btoa(u+':'+p);const r=await fetch(url,{headers:{Authorization:h}});show('HTTP '+r.status);const t=await r.text();show(t);try{const j=JSON.parse(t);if(j?.Response?.Data?.URL)show('\nLiveStreamURL: '+j.Response.Data.URL)}catch(e){}}catch(e){show('FETCH ERROR: '+e.name+' — '+e.message);show('\nاحتمالاً CORS یا Mixed Content توسط Chrome مسدود شده است.')}} </script></html>
