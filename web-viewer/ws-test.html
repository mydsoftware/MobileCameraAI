<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobileCameraAI WS/WSS Test</title><style>body{font-family:Arial;background:#111;color:#fff;padding:20px}button{padding:12px;margin:5px;font-size:16px}pre{white-space:pre-wrap;background:#222;padding:15px;border-radius:8px}</style><h2>تست مستقیم WS / WSS</h2><button onclick="test(1,8001)">دوربین ۱</button><button onclick="test(2,8002)">دوربین ۲</button><pre id="out">آماده تست...</pre><script>const out=document.getElementById('out');function log(x){out.textContent+=x+'\n'}function one(name,url){return new Promise(r=>{log('TEST '+name+' → '+url);let done=false;let t=setTimeout(()=>{if(!done){done=true;try{s.close()}catch(e){}log('TIMEOUT');r('TIMEOUT')}},5000);let s;try{s=new WebSocket(url);s.onopen=()=>{if(done)return;done=true;clearTimeout(t);log('CONNECTED');s.close();r('CONNECTED')};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);log('ERROR');r('ERROR')};s.onclose=e=>{if(!done){done=true;clearTimeout(t);log('CLOSED code='+e.code);r('CLOSED')}}}catch(e){if(done)return;done=true;clearTimeout(t);log('EXCEPTION '+e.message);r('EXCEPTION')}})}async function test(n,p){out.textContent='Camera '+n+'\n\n';await one('WS','ws://37.202.152.217:'+p+'/media/flv/video1');await one('WSS','wss://37.202.152.217:'+p+'/media/flv/video1');log('\nFinished')}} </script></html>
