<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MobileCameraAI — Live</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}header{height:58px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold}nav{height:58px;display:flex;gap:8px;padding:6px 10px}button{flex:1;border:0;border-radius:8px;font-size:16px;font-weight:bold;background:#222;color:#fff}button.active{background:#fff;color:#111}.view{height:calc(100% - 116px);position:relative;background:#000;display:flex;align-items:center;justify-content:center}.feed{width:100%;height:100%;object-fit:contain;background:#000}.error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#000;color:#ccc}.hint{font-size:14px;line-height:1.8}.small{font-size:12px;color:#888}
</style>
</head>
<body>
<header>MobileCameraAI</header>
<nav>
<button id="b1" class="active" type="button">دوربین ۱</button>
<button id="b2" type="button">دوربین ۲</button>
</nav>
<div class="view">
<img id="feed" class="feed" alt="Live Camera">
<div id="error" class="error"><div class="hint">تصویر دریافت نشد.<br>بررسی کنید Stream انتخاب‌شده روی دوربین روی <b>MJPEG</b> باشد.<br><span class="small">Uniview HTTP MJPEG</span></div></div>
</div>
<script>
const cameras={
  1:'http://37.202.152.217:8001/video/mjpeg/stream3',
  2:'http://37.202.152.217:8002/video/mjpeg/stream3'
};
const feed=document.getElementById('feed'), error=document.getElementById('error');
const buttons={1:document.getElementById('b1'),2:document.getElementById('b2')};
function openCamera(n){
  buttons[1].classList.toggle('active',n===1); buttons[2].classList.toggle('active',n===2);
  error.style.display='none'; feed.src=''; setTimeout(()=>{feed.src=cameras[n]},80);
}
feed.onerror=()=>{error.style.display='flex'};
buttons[1].onclick=()=>openCamera(1); buttons[2].onclick=()=>openCamera(2);
openCamera(1);
</script>
</body>
</html>
