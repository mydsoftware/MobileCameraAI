<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MobileCameraAI</title><style>html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Arial}header{height:50px;display:flex;align-items:center;justify-content:center}nav{height:50px;display:flex;gap:8px;padding:5px}button{flex:1;border:0;border-radius:8px;font-size:16px}video{width:100%;height:calc(100% - 105px);background:#000}</style></head><body><header>MobileCameraAI</header><nav><button id="b1">دوربین ۱</button><button id="b2">دوربین ۲</button></nav><video id="v" controls autoplay muted playsinline></video><script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script><script>
const urls={1:'wss://37.202.152.217:8001/media/flv/video1',2:'wss://37.202.152.217:8002/media/flv/video1'};let player;
function openCam(n){if(player){try{player.pause();player.unload();player.detachMediaElement();player.destroy()}catch(e){}player=null}const v=document.getElementById('v');v.removeAttribute('src');if(!flvjs.isSupported()){alert('FLV/WebSocket در این مرورگر پشتیبانی نمی‌شود');return}player=flvjs.createPlayer({type:'flv',isLive:true,url:urls[n]},{enableStashBuffer:false,liveBufferLatencyChasing:true,autoCleanupSourceBuffer:true});player.attachMediaElement(v);player.load();player.play().catch(()=>{});}document.getElementById('b1').onclick=()=>openCam(1);document.getElementById('b2').onclick=()=>openCam(2);openCam(1);
</script></body></html>
